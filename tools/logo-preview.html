<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Logo preview</title>
<link rel="stylesheet" href="../css/logo.css" />
<style>
  @font-face { font-family: 'Bangers'; src: url('../fonts/bangers.woff2') format('woff2'); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 30px; background: linear-gradient(#4aa8f5, #bfe6ff); }
  .big { font-size: 170px; }
  .small { font-size: 70px; }
</style>
</head>
<body>
<div class="big"><div class="wpf-logo flap" id="logo"></div></div>
<div class="small"><div class="wpf-logo" id="logo2"></div></div>
<script type="module">
import { logoHTML } from '../js/logo.js';
document.getElementById('logo').innerHTML = logoHTML();
document.getElementById('logo2').innerHTML = logoHTML();
await document.fonts.ready;
document.title = 'ready';
</script>
</body>
</html>
